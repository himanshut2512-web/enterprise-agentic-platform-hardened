[project]
name = "unreliable-assistant-hardened"
version = "0.1.0"
description = "Enterprise-grade MCP-enabled retrieval and agent platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "streamlit>=1.41",
  "httpx>=0.28",
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["ui*", "tests*", "eval*", "data*"]
